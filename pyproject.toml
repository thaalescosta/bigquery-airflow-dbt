[project]
name = "bigquery-airflow-dbt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thales Costa", email = "thaalescosta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-airflow-providers-google>=22.5.0",
    "apache-airflow-providers-http>=6.1.0",
    "apache-airflow-providers-slack>=9.10.2",
